[package]
name = "minesweeper-v2"
version = "2.0.0"
edition = "2021"
description = "Minesweeper v2: Rust compiled to WebAssembly"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Keep this pin in sync with WASM_BINDGEN_VERSION in scripts/build.sh.
wasm-bindgen = "=0.2.129"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "CssStyleDeclaration",
  "Document",
  "DomStringMap",
  "DomTokenList",
  "Element",
  "Event",
  "EventTarget",
  "HtmlButtonElement",
  "HtmlCollection",
  "HtmlDialogElement",
  "HtmlElement",
  "HtmlFormElement",
  "HtmlInputElement",
  "KeyboardEvent",
  "MediaQueryList",
  "MouseEvent",
  "Navigator",
  "Node",
  "NodeList",
  "Performance",
  "PointerEvent",
  "Storage",
  "UiEvent",
  "Window",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
